name: Build Vodafone Cards APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Gradle Wrapper JAR
      run: |
        mkdir -p /tmp/wrap
        touch /tmp/wrap/settings.gradle
        (cd /tmp/wrap && gradle wrapper)
        mkdir -p gradle/wrapper
        cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VodafoneCards-APK
        path: app/build/outputs/apk/debug/*.apk
