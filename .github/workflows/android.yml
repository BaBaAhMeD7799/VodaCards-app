name: Build Vodafone Cards APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Restore missing Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        TMP_DIR=$(mktemp -d)
        (cd "$TMP_DIR" && gradle wrapper)
        cp "$TMP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VodafoneCards-APK
        path: app/build/outputs/apk/debug/*.apk
